<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Obsession For You ❤️</title>
<style>
  /* --- CSS STYLES START --- */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Courier New', Courier, monospace; /* More edgy, unique font */
    background: linear-gradient(135deg, #0a0514 0%, #1a0f2b 50%, #2a1830 100%); /* Deeper, more mysterious gradient */
    color: #e0d7ff; /* Lighter, almost ethereal text */
    line-height: 1.9;
    overflow-x: hidden;
  }
  .bg {
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 30% 30%, rgba(120,80,150,0.25), transparent 50%), /* More intense purple center */
      radial-gradient(circle at 70% 60%, rgba(80,60,120,0.20), transparent 50%), /* Subdued edges */
      radial-gradient(circle at 10% 90%, rgba(60,40,90,0.15), transparent 50%); /* Deeper, shadowed corners */
    z-index: -2;
  }
  .bg::after {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.3) 1px, transparent 1px); /* Finer, more scattered stars */
    background-size: 70px 70px;
    opacity: 0.3;
    animation: drift 70s linear infinite; /* Slower, more hypnotic drift */
  }
  @keyframes drift { from { transform: translateY(0); } to { transform: translateY(-70px); } }

  header { text-align: center; padding: 6rem 1.5rem 4rem; }
  header h1 {
    font-size: clamp(2rem, 6vw, 3.5rem); /* Larger, more impactful title */
    background: linear-gradient(90deg, #d8bfd8, #9370db, #6a5acd); /* More vibrant purple gradient */
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 1.5rem;
    text-shadow: 0 0 10px rgba(100,60,150,0.5); /* Subtle glow */
  }
  header p { color: #c8c0d8; font-style: italic; max-width: 700px; margin: 0 auto; font-size: 1.1rem; }
  .pulse { font-size: 2.5rem; display: inline-block; animation: pulse 1.6s ease-in-out infinite; color: #d8bfd8; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.3); } } /* More pronounced pulse */

  section { max-width: 850px; margin: 0 auto; padding: 3rem 2rem; } /* Wider sections */

  .letter {
    background: rgba(30,15,40,0.85); /* Even darker, richer background */
    border: 1px solid rgba(100,60,150,0.4); /* More prominent purple border */
    border-radius: 25px; /* Softer corners */
    padding: 2.5rem 2rem;
    backdrop-filter: blur(10px); /* More intense blur */
    box-shadow: 0 30px 80px rgba(0,0,0,0.6); /* Deeper, more dramatic shadow */
  }
  .letter p { margin-bottom: 1.8rem; font-size: 1.1rem; } /* Larger text */
  .letter .drop::first-letter {
    font-size: 3.8rem; float: left; line-height: 1; padding-right: 0.6rem; color: #d8bfd8; /* Larger, more impactful initial */
  }
  .divider { text-align: center; color: #d8bfd8; letter-spacing: 1rem; margin: 2rem 0; opacity: 0.9; font-size: 1.2rem; } /* More prominent divider */

  h2.section-title { text-align: center; font-size: clamp(1.5rem, 4.5vw, 2.2rem); margin-bottom: 0.8rem; color: #e0d7ff; text-shadow: 0 0 8px rgba(100,60,150,0.4); } /* Lighter purple, more glow */
  .section-sub { text-align: center; color: #b9a4c4; font-style: italic; margin-bottom: 2.5rem; font-size: 1rem; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1.2rem; } /* Larger cards */
  .card { perspective: 1500px; height: 220px; } /* Taller cards */
  .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.8s; transform-style: preserve-3d; }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .card-face {
    position: absolute; inset: 0; backface-visibility: hidden; border-radius: 20px; /* Softer corners */
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 1.2rem; border: 1px solid rgba(100,60,150,0.4); /* Prominent border */
  }
  .card-front { background: linear-gradient(170deg, #3a1f3a, #2a102a); font-size: 2rem; } /* Even richer gradient */
  .card-front span { font-size: 0.9rem; margin-top: 1rem; color: #d0c0e0; } /* Slightly larger text */
  .card-back {
    background: linear-gradient(170deg, #9370db, #6a5acd); /* More vibrant purple gradient */
    color: #f5e9f0; /* Lighter text */
    transform: rotateY(180deg); font-size: 0.95rem; font-weight: 600; line-height: 1.6; /* More spacing */
  }

  .envelopes { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.2rem; } /* Larger envelopes */
  .envelope {
    background: linear-gradient(170deg, #3a1f3a, #2a102a); /* Even richer gradient */
    border: 1px solid rgba(100,60,150,0.4); /* Prominent border */
    border-radius: 20px; padding: 1.5rem;
    cursor: pointer; transition: transform 0.4s, box-shadow 0.4s;
  }
  .envelope:hover { transform: translateY(-6px); box-shadow: 0 20px 45px rgba(100,60,150,0.25); } /* More pronounced shadow */
  .envelope .env-title { font-weight: 700; color: #d8bfd8; font-size: 1.1rem; } /* Lighter, more prominent purple title */
  .envelope .env-body {
    max-height: 0; overflow: hidden; opacity: 0; color: #ecd7e6; font-size: 1rem; font-style: italic;
    transition: max-height 0.6s ease, margin-top 0.5s ease, opacity 0.5s ease;
  }
  .envelope.open .env-body { max-height: 600px; margin-top: 1.2rem; opacity: 1; }
  .envelope .hint { font-size: 0.8rem; color: #a996b8; margin-top: 0.6rem; }

  /* Specific style for hidden desires */
  .hidden-desire {
    color: #d8bfd8; /* Lighter purple for desires */
    font-weight: bold;
    cursor: pointer;
    position: relative;
    text-decoration: underline dashed;
    text-decoration-thickness: 1.5px; /* Thicker underline */
    text-underline-offset: 4px;
    animation: pulse-underline 1.8s ease-in-out infinite; /* Faster pulse */
  }
  @keyframes pulse-underline {
    0% { text-shadow: 0 0 5px rgba(200,160,200,0.4); }
    50% { text-shadow: 0 0 15px rgba(200,160,200,0.9); }
    100% { text-shadow: 0 0 5px rgba(200,160,200,0.4); }
  }
  .hidden-desire::after {
    content: "🤫";
    font-size: 0.8em; /* Larger icon */
    position: absolute;
    right: -18px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .hidden-desire:hover::after { opacity: 1; }

  .secret {
    display: inline-block; cursor: pointer; color: #d8bfd8; /* Lighter purple for secrets */
    font-size: 1.1rem;
    padding: 0 0.25rem; animation: glow 2s ease-in-out infinite; user-select: none;
  }
  @keyframes glow {
    0%,100% { text-shadow: 0 0 5px rgba(200,160,200,0.4); }
    50% { text-shadow: 0 0 18px rgba(200,160,200,0.95); }
  }
  .secret-popup {
    position: fixed; inset: 0; background: rgba(5,0,10,0.9); /* Even darker overlay */
    display: none;
    align-items: center; justify-content: center; padding: 2rem; z-index: 50; backdrop-filter: blur(6px); /* More blur */
  }
  .secret-popup.show { display: flex; animation: fadeIn 0.5s; }
  .secret-popup .box {
    background: linear-gradient(170deg, #3a1f3a, #2a102a); /* Even richer gradient */
    border: 1px solid rgba(100,60,150,0.5); /* More prominent border */
    border-radius: 25px; padding: 2.5rem 2rem;
    max-width: 480px; /* Wider popup box */
    text-align: center; box-shadow: 0 35px 90px rgba(100,60,150,0.35); /* More dramatic shadow */
  }
  .secret-popup .box .heart-big { font-size: 2.8rem; color: #d8bfd8; } /* Larger, lighter purple heart */
  .secret-popup .box p { margin: 1.2rem 0 1.8rem; font-size: 1.15rem; } /* Larger text in popup */
  .secret-popup .box button {
    background: #9370db; /* Vibrant purple button */
    border: none; color: #f5e9f0;
    padding: 0.8rem 2rem; /* Larger button */
    border-radius: 40px; /* More rounded */
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    font-size: 1.1rem; /* Larger text */
    transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
  }
  .secret-popup .box button:hover {
    background: #6a5acd;
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(100,60,150,0.3);
  }

  footer { text-align: center; padding: 4rem 2rem 5rem; color: #b9a4c4; font-style: italic; font-size: 1rem; } /* Larger text */
  footer .big { font-size: 1.5rem; color: #d8bfd8; display: block; margin-bottom: 0.6rem; } /* Larger purple accent */

  .fade-in { opacity: 0; transform: translateY(35px); transition: opacity 1.2s ease, transform 1.2s ease; } /* Slower, more dramatic fade-in */
  .fade-in.visible { opacity: 1; transform: translateY(0); }

  .interactive-question {
    background: rgba(40,20,50,0.7);
    border: 1px solid rgba(100,60,150,0.4);
    border-radius: 20px; /* Softer corners */
    padding: 1.8rem; /* More padding */
    margin-top: 2rem; /* More space above */
    box-shadow: 0 15px 40px rgba(0,0,0,0.5); /* Deeper shadow */
  }
  .interactive-question h3 {
    font-size: 1.2rem; /* Larger title */
    margin-bottom: 1.2rem;
    color: #e0d7ff;
    font-style: italic;
  }
